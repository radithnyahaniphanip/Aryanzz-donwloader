name: Deploy ARYANZZ to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aryanzz-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      # Keep the downloader provider key in sync with GitHub Actions secrets.
      - name: Configure YouTube downloader secret
        env:
          SAVENOW_API_KEY: ${{ secrets.SAVENOW_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SAVENOW_API_KEY" ]; then
            echo "::warning::SAVENOW_API_KEY is not configured. YouTube extraction will remain disabled."
          else
            printf '%s' "$SAVENOW_API_KEY" | wrangler secret put SAVENOW_API_KEY
          fi

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
