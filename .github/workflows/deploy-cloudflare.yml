name: ARYANZZ — Validate and deploy V94.27.x

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aryanzz-cloudflare-production
  cancel-in-progress: true

jobs:
  test:
    name: Validate V94.27.x release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Check every loaded JavaScript asset
        run: |
          node --check src/index.js
          node --check src/platform-catalog.js
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("public/index.html","utf8"); const refs=[...html.matchAll(/<script[^>]*src="([^"]+\.js[^"]*)"/g)].map(m=>m[1]).filter(ref=>ref.startsWith("/")); const paths=[...new Set(refs.map(ref=>"public/"+new URL(ref,"https://aryanzz.local").pathname.slice(1)))]; for(const path of paths){if(!fs.existsSync(path))throw new Error("Missing script asset: "+path); console.log("Checking "+path); const {spawnSync}=await import("node:child_process"); const result=spawnSync(process.execPath,["--check",path],{stdio:"inherit"}); if(result.status!==0)process.exit(result.status||1);} console.log("All "+paths.length+" loaded JavaScript assets passed syntax checks.");'
          node --check tests/release-smoke.mjs
          node --check tests/live-release-smoke.mjs
          node --check tests/live-platform-matrix.mjs
          node --check tests/live-tiktok-user-link.mjs
          node --check tests/live-tiktok-photo-diagnostics.mjs
          node --check tests/tiktok-native-fallback.mjs
          node --check tests/live-instagram-image-link.mjs
          node --check tests/live-provider-fallbacks.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const s=h.indexOf('<script>')+8;const e=h.indexOf('</script>',s);if(s<8||e<s)throw Error('Inline script missing');new Function(h.slice(s,e));console.log('Inline script syntax OK')"
      - name: Run release smoke tests
        run: npm run test:release
      - name: Run legacy regression suite (diagnostic only)
        continue-on-error: true
        run: npm test

  deploy:
    name: Deploy V94.27.x to Cloudflare Workers
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare deployment credentials are present."
      - name: Verify Cloudflare token access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build:version && wrangler deploy
      - name: Configure optional AudD music recognition secret
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$AUDD_API_TOKEN" ]; then
            echo "::notice::AUDD_API_TOKEN is not set; music recognition remains unavailable, but deployment is unaffected."
          else
            printf '%s' "$AUDD_API_TOKEN" | wrangler secret put AUDD_API_TOKEN
          fi
      - name: Export exact expected build version
        run: |
          node --input-type=module -e 'import { BUILD_VERSION } from "./src/build-version.js"; process.stdout.write("EXPECTED_BUILD_VERSION=" + BUILD_VERSION + "\n")' >> "$GITHUB_ENV"
      - name: Verify live Cloudflare deployment
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-release-smoke.mjs
      - name: Diagnose user-supplied TikTok link playback, duration and download
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-tiktok-user-link.mjs
      - name: Diagnose TikTok Photo Mode public image endpoints
        if: github.event_name == 'workflow_dispatch' && success()
        continue-on-error: true
        timeout-minutes: 3
        run: node tests/live-tiktok-photo-diagnostics.mjs
      - name: Diagnose user-supplied Instagram post image extraction and download
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-instagram-image-link.mjs
      - name: Diagnose TikWM and Instagram public embed fallbacks
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-provider-fallbacks.mjs
      - name: Optional manual diagnostic matrix for the 20 dedicated provider choices
        if: github.event_name == 'workflow_dispatch' && success()
        continue-on-error: true
        timeout-minutes: 18
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-platform-matrix.mjs
      - name: Upload 20-dedicated-provider diagnostic matrix
        if: always() && hashFiles('platform-matrix.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aryanzz-dedicated-platform-matrix
          path: platform-matrix.json
          retention-days: 14
