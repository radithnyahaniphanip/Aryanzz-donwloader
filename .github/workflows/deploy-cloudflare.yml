name: ARYANZZ — Validate and deploy V1 Full Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aryanzz-cloudflare-production
  cancel-in-progress: true

jobs:
  test:
    name: Validate V1 Full Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Check every loaded JavaScript asset
        run: |
          node --check src/index.js
          node --check src/auth.js
          node --check public/guest-access.js
          node --check tests/guest-access-smoke.mjs
          node --check tests/live-public-access-smoke.mjs
          node --check src/membership.js
          node --check src/membership-store.js
          node --check src/platform-catalog.js
          node --check scripts/build-version.mjs
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("public/index.html","utf8"); const refs=[...html.matchAll(/<script[^>]*src="([^"]+\.js[^"]*)"/g)].map(m=>m[1]).filter(ref=>ref.startsWith("/")); const paths=[...new Set(refs.map(ref=>"public/"+new URL(ref,"https://aryanzz.local").pathname.slice(1)))]; for(const path of paths){if(!fs.existsSync(path))throw new Error("Missing script asset: "+path); console.log("Checking "+path); const {spawnSync}=await import("node:child_process"); const result=spawnSync(process.execPath,["--check",path],{stdio:"inherit"}); if(result.status!==0)process.exit(result.status||1);} console.log("All "+paths.length+" loaded JavaScript assets passed syntax checks.");'
          node --check tests/release-smoke.mjs
          node --check tests/profile-motion-avatar-smoke.mjs
          node --check tests/auth-gate-smoke.mjs
          node --check tests/module-boundaries-smoke.mjs
          node --check tests/auth-backend-smoke.mjs
          node --check tests/live-runtime-config-smoke.mjs
          node --check tests/membership-payment-smoke.mjs
          node --check tests/membership-smoke.mjs
          node --check tests/live-release-smoke.mjs
          node --check tests/live-platform-matrix.mjs
          node --check tests/live-tiktok-user-link.mjs
          node --check tests/live-tiktok-photo-diagnostics.mjs
          node --check tests/tiktok-native-fallback.mjs
          node --check tests/live-instagram-image-link.mjs
          node --check tests/live-provider-fallbacks.mjs
          node --check tests/social-media-file-probe.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const s=h.indexOf('<script>')+8;const e=h.indexOf('</script>',s);if(s<8||e<s)throw Error('Inline script missing');new Function(h.slice(s,e));console.log('Inline script syntax OK')"
      - name: Run release smoke tests
        run: |
          node tests/membership-smoke.mjs
          node tests/guest-access-smoke.mjs
          npm run test:release
      - name: Run legacy regression suite (diagnostic only)
        continue-on-error: true
        run: npm test

  deploy:
    name: Deploy V1 Full Release to Cloudflare Workers
    needs: test
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare deployment credentials are present."
      - name: Verify Cloudflare token access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami
      - name: Provision ARYANZZ account database when D1 access is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARYANZZ_AUTH_DB_ID: ${{ secrets.ARYANZZ_AUTH_DB_ID }}
        run: |
          set -euo pipefail
          echo "ARYANZZ_D1_READY=false" >> "$GITHUB_ENV"
          DB_ID="$ARYANZZ_AUTH_DB_ID"
          if [ -z "$DB_ID" ]; then
            if ! DB_LIST="$(curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" 2>&1)"; then
              echo "::notice::D1 is not accessible with the current Cloudflare token. Deploying the public V1 website without the account database so visitors can use ARYANZZ without login or registration. Server-synced IDs, administrator authentication and D1-backed moderation remain unavailable until Account > D1 > Edit is granted. Membership checkout uses its separate Durable Object storage and does not require D1."
              exit 0
            fi
            DB_ID="$(printf '%s' "$DB_LIST" | jq -r '.result[]? | select(.name == "aryanzz-auth-db") | .uuid' | head -n 1)"
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "No existing aryanzz-auth-db found; attempting to create it."
            if ! CREATE_OUTPUT="$(wrangler d1 create aryanzz-auth-db 2>&1)"; then
              echo "::notice::Could not create the optional account database with the current token. Continuing with public V1 access; D1-dependent account and Membership services remain pending."
              exit 0
            fi
            DB_ID="$(printf '%s\\n' "$CREATE_OUTPUT" | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\\1/p' | head -n 1)"
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::notice::The D1 database ID is not available. Continuing with public V1 access; configure ARYANZZ_AUTH_DB_ID and Account > D1 > Edit to enable server account services."
            exit 0
          fi
          cp wrangler.toml /tmp/aryanzz-wrangler-before-d1.toml
          if ! grep -q 'binding = "AUTH_DB"' wrangler.toml; then
            printf '\n[[d1_databases]]\nbinding = "AUTH_DB"\ndatabase_name = "aryanzz-auth-db"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$DB_ID" >> wrangler.toml
          fi
          if ! wrangler d1 migrations apply aryanzz-auth-db --remote; then
            cp /tmp/aryanzz-wrangler-before-d1.toml wrangler.toml
            echo "::notice::D1 migrations could not be applied with the current token. Continuing with public V1 access only; D1-backed login, account sync and cosmetics remain pending; Membership checkout uses Durable Object storage."
            exit 0
          fi
          echo "ARYANZZ_D1_READY=true" >> "$GITHUB_ENV"
          echo "ARYANZZ D1 account database is ready and AUTH_DB is included in this deployment."
      - name: Sync ARYANZZ account email and CAPTCHA secrets when configured
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET || secrets.CF_TURNSTILE_SECRET_KEY }}
          AUTH_TURNSTILE_SITE_KEY: ${{ secrets.AUTH_TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY || secrets.CF_TURNSTILE_SITE_KEY }}
          MEMBERSHIP_QRIS_IMAGE_URL: ${{ secrets.MEMBERSHIP_QRIS_IMAGE_URL }}
          MEMBERSHIP_WEBHOOK_SECRET: ${{ secrets.MEMBERSHIP_WEBHOOK_SECRET }}
          POKETO_SECRET_KEY: ${{ secrets.POKETO_SECRET_KEY || secrets.POKETO_API_KEY }}
          POKETO_WEBHOOK_SECRET: ${{ secrets.POKETO_WEBHOOK_SECRET || secrets.POKETO_SIGNING_SECRET }}
          POKETO_MODE: ${{ secrets.POKETO_MODE }}
        run: |
          for name in AUTH_SESSION_SECRET RESEND_API_KEY AUTH_EMAIL_FROM TURNSTILE_SECRET_KEY AUTH_TURNSTILE_SITE_KEY MEMBERSHIP_QRIS_IMAGE_URL MEMBERSHIP_WEBHOOK_SECRET POKETO_SECRET_KEY POKETO_WEBHOOK_SECRET POKETO_MODE; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              printf '%s' "$value" | wrangler secret put "$name"
              echo "Synced Worker setting: $name"
            else
              echo "::notice::Worker setting $name is not supplied; any existing Cloudflare value is left unchanged."
            fi
          done
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build:version
          set -o pipefail
          wrangler deploy --keep-vars 2>&1 | tee /tmp/aryanzz-wrangler-deploy.log
          VERSION_ID=$(grep -oE 'Current Version ID: [0-9a-f-]+' /tmp/aryanzz-wrangler-deploy.log | tail -n 1 | awk '{print $4}')
          test -n "$VERSION_ID" || { echo "::error::Wrangler did not report the newly uploaded Worker version ID."; exit 1; }
          echo "Promoting Worker version $VERSION_ID to 100% production traffic."
          wrangler versions deploy "$VERSION_ID@100%" --yes
          wrangler deployments status
      - name: Preserve existing optional AudD music recognition secret
        run: echo "::notice::Existing AUDD_API_TOKEN secret is preserved and is not rewritten during routine deployments."
      - name: Export exact expected build version
        run: |
          node --input-type=module -e 'import { BUILD_VERSION } from "./src/build-version.js"; process.stdout.write("EXPECTED_BUILD_VERSION=" + BUILD_VERSION + "\n")' >> "$GITHUB_ENV"
      - name: Verify live Cloudflare deployment
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-release-smoke.mjs
      - name: Verify public access has no login or registration overlay
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
          EXPECTED_BUILD_VERSION: ${{ env.EXPECTED_BUILD_VERSION }}
        run: node tests/live-public-access-smoke.mjs
      - name: Verify D1-independent Membership storage and payment readiness
        if: success()
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-membership-store-smoke.mjs
      - name: Verify production D1, Turnstile and Poketo bindings
        if: success() && env.ARYANZZ_D1_READY == 'true'
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-runtime-config-smoke.mjs
      - name: Create automatic recovery checkpoint
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
            const tag = `checkpoint-${stamp}-${sha.slice(0, 7)}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha
              });
              core.notice(`Recovery checkpoint created: ${tag} -> ${sha}`);
            } catch (error) {
              if (error.status === 422) {
                core.notice(`Checkpoint ${tag} already exists; nothing to overwrite.`);
              } else {
                throw error;
              }
            }
      - name: Diagnose user-supplied TikTok link playback, duration and download
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-tiktok-user-link.mjs
      - name: Diagnose TikTok Photo Mode public image endpoints
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-tiktok-photo-diagnostics.mjs
      - name: Diagnose user-supplied Instagram post image extraction and download
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-instagram-image-link.mjs
      - name: Diagnose TikWM and Instagram public embed fallbacks
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-provider-fallbacks.mjs
      - name: Optional manual diagnostic matrix for the 20 dedicated provider choices
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'RUN FULL PLATFORM MATRIX')))
        continue-on-error: true
        timeout-minutes: 18
        env:
          WORKER_URL: https://aryanzz-donwloader.aryanz.workers.dev
        run: node tests/live-platform-matrix.mjs
      - name: Upload 20-dedicated-provider diagnostic matrix
        if: always() && hashFiles('platform-matrix.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aryanzz-dedicated-platform-matrix
          path: platform-matrix.json
          retention-days: 14
