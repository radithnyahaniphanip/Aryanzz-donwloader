name: Deploy ARYANZZ V67.2 to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Enable Docker Buildx for Cloudflare Containers
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker engine
        run: docker info

      - name: Configure AudD music recognition secret
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$AUDD_API_TOKEN" ]; then
            echo "::warning::AUDD_API_TOKEN is not configured. Music Finder will remain disabled until the secret is added."
          else
            printf '%s' "$AUDD_API_TOKEN" | wrangler secret put AUDD_API_TOKEN
          fi

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test live Worker and V67.2 editor assets
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const healthResponse = await fetch(base + "/api/health", { cache: "no-store" });
          if (!healthResponse.ok) throw new Error("Live Worker health check failed: HTTP " + healthResponse.status);
          const health = await healthResponse.json();
          if (health.version !== "67.2" || !health.selfHostedDownloader || !health.platformExtraction || !health.musicFallbackReady || !health.directMediaDownload) {
            throw new Error("Live Worker or Cloudflare Container backend is not configured: " + JSON.stringify(health));
          }
          console.log("Live Worker health OK: V" + health.version + ".");

          for (const path of ["/editor.js?v=65.0", "/editor-pro.css?v=65.0", "/music-recognition.js?v=67.2", "/music-recognition.css?v=67.2", "/v59.js?v=59.5", "/v59.css?v=59.5"]) {
            const response = await fetch(base + path, { cache: "no-store" });
            if (!response.ok) throw new Error("Static asset unavailable: " + path + " HTTP " + response.status);
          }
          console.log("V67.2 Creative Studio and Music Finder assets are available.");

          const musicResponse = await fetch(base + "/api/music/status", { cache: "no-store" });
          if (!musicResponse.ok) throw new Error("Music Finder status endpoint failed.");
          const music = await musicResponse.json();
          if (!music.configured || !music.videoUrlReady) {
            throw new Error("Live Worker cannot read AUDD_API_TOKEN. Check the secret binding on the production Worker service.");
          }
          console.log("Music Finder recognition provider is configured on the live Worker.");

          let status = null;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const statusResponse = await fetch(base + "/api/platform/status", { cache: "no-store", signal: AbortSignal.timeout(75000) });
              status = await statusResponse.json();
              if (status.ok) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!status?.ok) throw new Error("Cloudflare yt-dlp + FFmpeg container did not become healthy: " + JSON.stringify(status));
          console.log("Cloudflare downloader container is online.");

          const musicStatusResponse = await fetch(base + "/api/music/status", { cache: "no-store" });
          const musicStatus = await musicStatusResponse.json();
          if (!musicStatus.shazamFallbackReady) throw new Error("Shazam fallback container is not ready.");
          console.log("Shazam fallback provider is available.");
          NODE
