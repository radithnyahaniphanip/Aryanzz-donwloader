name: Deploy ARYANZZ to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      # Keep the downloader provider key in sync with GitHub Actions secrets.
      - name: Configure YouTube downloader secret
        env:
          SAVENOW_API_KEY: ${{ secrets.SAVENOW_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SAVENOW_API_KEY" ]; then
            echo "::warning::SAVENOW_API_KEY is not configured. YouTube extraction will remain disabled."
          else
            printf '%s' "$SAVENOW_API_KEY" | wrangler secret put SAVENOW_API_KEY
          fi

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test live Worker and non-billable YouTube metadata
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const healthResponse = await fetch(base + "/api/health", { cache: "no-store" });
          if (!healthResponse.ok) throw new Error("Live Worker health check failed: HTTP " + healthResponse.status);
          const health = await healthResponse.json();
          if (health.version !== "29.0" || !health.youtubeApiKeyConfigured) {
            throw new Error("Live Worker version or YouTube secret status is incorrect: " + JSON.stringify(health));
          }
          console.log("Live Worker health OK: V" + health.version + ", API key configured.");

          const sample = "https://www.youtube.com/watch?v=K1Pu75yJUOE";
          const infoResponse = await fetch(base + "/api/youtube/info?url=" + encodeURIComponent(sample), { cache: "no-store" });
          const info = await infoResponse.json();
          if (!infoResponse.ok || !info.ok || !info.title) {
            if (/not enough balance|insufficient balance|low balance/i.test(info.error || "")) {
              console.warn("SaveNow API key is reachable, but its wallet needs a top-up before downloads can be created.");
            } else {
              throw new Error("SaveNow metadata check failed: " + (info.error || "No video title returned."));
            }
          } else if (info.providerReady === false) {
            console.warn("YouTube preview is available, but SaveNow wallet balance is insufficient. Paid download jobs remain disabled.");
          } else {
            console.log("SaveNow non-billable metadata check OK: " + info.title);
          }
          NODE
