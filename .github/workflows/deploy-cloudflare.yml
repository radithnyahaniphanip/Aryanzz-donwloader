name: Deploy ARYANZZ V72.2 to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Update secrets only after a Worker version has been deployed.
      - name: Configure AudD music recognition secret
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$AUDD_API_TOKEN" ]; then
            echo "::warning::AUDD_API_TOKEN is not configured. Music Finder will remain disabled until the secret is added."
          else
            printf '%s' "$AUDD_API_TOKEN" | wrangler secret put AUDD_API_TOKEN
          fi

      - name: Remove legacy self-hosted extractor secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret delete PLATFORM_API_ORIGIN || true
          wrangler secret delete PLATFORM_API_TOKEN || true

      - name: Smoke test live Worker and V72.2 creative assets
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          let health = null;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const healthResponse = await fetch(base + "/api/health", { cache: "no-store", signal: AbortSignal.timeout(10000) });
              if (healthResponse.ok) health = await healthResponse.json();
              if (health?.version === "72.2" && health?.mode === "cloudflare-worker-zero-server-hybrid") break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2500));
          }
          if (health?.version !== "72.2" || health?.mode !== "cloudflare-worker-zero-server-hybrid" || !health?.directMediaDownload) {
            throw new Error("Live Worker has not propagated the V72.2 zero-server deployment: " + JSON.stringify(health));
          }
          console.log("Live Worker health OK: V" + health.version + " in zero-server mode.");

          for (const path of ["/editor.js?v=65.0", "/editor-pro.css?v=65.0", "/music-recognition.js?v=71.0", "/music-recognition.css?v=71.0", "/v674.js?v=67.6", "/v674.css?v=67.6", "/v677.js?v=67.7", "/v677.css?v=67.7", "/v680.js?v=71.0", "/v680.css?v=71.0", "/v690.css?v=71.0", "/downloader.js?v=72.2", "/v59.js?v=59.5", "/v59.css?v=59.5"]) {
            const response = await fetch(base + path, { cache: "no-store" });
            if (!response.ok) throw new Error("Static asset unavailable: " + path + " HTTP " + response.status);
          }
          const downloaderResponse = await fetch(base + "/downloader.js?v=72.2", { cache: "no-store" });
          const downloaderSource = await downloaderResponse.text();
          const parserStart = downloaderSource.indexOf("function browserVideoFormat");
          const parserEnd = downloaderSource.indexOf("function browserAudioFormat", parserStart);
          const parser = downloaderSource.slice(parserStart, parserEnd);
          if (parserStart < 0 || parserEnd < 0 || parser.indexOf("const url=browserHybridMediaUrl") < 0 || parser.indexOf("const height=browserVideoHeight") < parser.indexOf("const url=browserHybridMediaUrl")) {
            throw new Error("Live browser MP4 parser failed its URL initialization regression check.");
          }
          console.log("Live browser MP4 parser URL initialization check passed.");
                    console.log("V72.2 Creative Studio, Tools Center, and Music Finder assets are available.");

          const titleSearchProbe = await fetch(base + "/api/search", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query: "x" }) });
          if (titleSearchProbe.status !== 400) throw new Error("Title-search endpoint validation failed: HTTP " + titleSearchProbe.status);
          console.log("Title-search endpoint is mounted and validates query input.");

          const musicResponse = await fetch(base + "/api/music/status", { cache: "no-store" });
          if (!musicResponse.ok) throw new Error("Music Finder status endpoint failed.");
          const music = await musicResponse.json();
          if (!music.configured || !music.videoUrlReady) {
            console.warn("Music recognition is not configured yet. Add AUDD_API_TOKEN or connect the external backend.");
          } else {
            console.log("Music recognition provider is configured.");
          }

          const statusResponse = await fetch(base + "/api/platform/status", { cache: "no-store" });
          const status = await statusResponse.json();
          if (!status.ok || status.backend !== "community-handoff") throw new Error("Zero-server platform handoff status failed: " + JSON.stringify(status));
          console.log("Zero-server community-provider handoff is available.");

          const youtubeStatusResponse = await fetch(base + "/api/youtube/status", { cache: "no-store" });
          if (!youtubeStatusResponse.ok) throw new Error("Hybrid YouTube status endpoint failed.");
          const youtubeStatus = await youtubeStatusResponse.json();
          if (youtubeStatus.provider !== "Dynamic Piped + Invidious hybrid" || youtubeStatus.paidProvider !== false || youtubeStatus.cobalt !== false) {
            throw new Error("V72.2 must use the no-paid Piped/Invidious hybrid only: " + JSON.stringify(youtubeStatus));
          }
          console.log("Hybrid YouTube status confirms dynamic Piped + Invidious, no Cobalt and no paid provider.");

          const hybridProbe = await fetch(base + "/api/youtube/hybrid/info?url=" + encodeURIComponent("https://youtu.be/4dpnHLPMQGs"), { cache: "no-store", signal: AbortSignal.timeout(45000) });
          if (!hybridProbe.ok) throw new Error("Hybrid YouTube endpoint failed: HTTP " + hybridProbe.status);
          const hybridData = await hybridProbe.json();
          if (!Array.isArray(hybridData.formats)) throw new Error("Hybrid endpoint did not return a formats array.");
          if (hybridData.providerReady) {
            if (!["Piped", "Invidious"].includes(hybridData.provider) || !hybridData.formats.length) throw new Error("Hybrid provider response is incomplete.");
            const mp4Formats = hybridData.formats.filter(item => item.mode === "video" && item.ext === "mp4");
            if (!mp4Formats.length) console.warn("The server-side community probe returned no MP4; browser-side Invidious discovery remains the primary route.");
            else console.log("Live public instance returned " + mp4Formats.length + " progressive MP4 video formats from " + hybridData.provider + ".");
          } else {
            console.warn("No public instance currently returned a compatible stream. Diagnostics: " + JSON.stringify(hybridData.diagnostics || []));
            console.warn("The zero-cost failover path is deployed, but real download availability is not confirmed.");
          }
          NODE
