name: Deploy ARYANZZ V78.0 to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ARYANZZ smoke tests
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Update secrets only after a Worker version has been deployed.
      - name: Configure AudD music recognition secret
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$AUDD_API_TOKEN" ]; then
            echo "::warning::AUDD_API_TOKEN is not configured. Music Finder will remain disabled until the secret is added."
          else
            printf '%s' "$AUDD_API_TOKEN" | wrangler secret put AUDD_API_TOKEN
          fi

      - name: Remove legacy self-hosted extractor secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler secret delete PLATFORM_API_ORIGIN || true
          wrangler secret delete PLATFORM_API_TOKEN || true

      - name: Smoke test live Worker and V78.0 creative assets
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          let health = null;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const healthResponse = await fetch(base + "/api/health", { cache: "no-store", signal: AbortSignal.timeout(10000) });
              if (healthResponse.ok) health = await healthResponse.json();
              if (health?.version === "78.0" && health?.mode === "cloudflare-worker-zero-server-hybrid") break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 2500));
          }
          if (health?.version !== "78.0" || health?.mode !== "cloudflare-worker-zero-server-hybrid" || !health?.directMediaDownload) {
            throw new Error("Live Worker has not propagated the V78.0 zero-server deployment: " + JSON.stringify(health));
          }
          console.log("Live Worker health OK: V" + health.version + " in zero-server mode.");

          for (const path of ["/editor.js?v=65.0", "/editor-pro.css?v=65.0", "/music-recognition.js?v=71.0", "/music-recognition.css?v=71.0", "/v674.js?v=78.0", "/v674.css?v=78.0", "/v677.js?v=67.7", "/v677.css?v=67.7", "/v680.js?v=71.0", "/v680.css?v=71.0", "/v690.css?v=71.0", "/downloader.js?v=78.0", "/downloader.css?v=78.0", "/v59.js?v=59.5", "/v59.css?v=59.5", "/audio-studio.js?v=78.0", "/audio-studio.css?v=78.0"]) {
            const response = await fetch(base + path, { cache: "no-store" });
            if (!response.ok) throw new Error("Static asset unavailable: " + path + " HTTP " + response.status);
          }
          const downloaderResponse = await fetch(base + "/downloader.js?v=78.0", { cache: "no-store" });
          const downloaderSource = await downloaderResponse.text();
          if (!downloaderSource.includes("Provider komunitas menolak stream") || !downloaderSource.includes('postJson("/api/info",{url})')) {
            throw new Error("Live YouTube downloader is missing its public-free-provider fallback after 403/429.");
          }
          if (!downloaderSource.includes('info.providerName==="Public API"') || !downloaderSource.includes("v737-media-preview") || !downloaderSource.includes("selected.downloadUrl")) {
            throw new Error("Live downloader is missing V73.7 in-page social preview or public-provider download handling.");
          }
          const searchResponse = await fetch(base + "/v674.js?v=78.0", { cache: "no-store" });
          const searchSource = await searchResponse.text();
          if (!searchResponse.ok || !searchSource.includes("/api/social/search") || !searchSource.includes("Lihat & unduh")) {
            throw new Error("V73.7 in-page social title search assets are not live.");
          }
          const parserStart = downloaderSource.indexOf("function browserVideoFormat");
          const parserEnd = downloaderSource.indexOf("function browserAudioFormat", parserStart);
          const parser = downloaderSource.slice(parserStart, parserEnd);
          if (parserStart < 0 || parserEnd < 0 || parser.indexOf("const url=browserHybridMediaUrl") < 0 || parser.indexOf("const height=browserVideoHeight") < parser.indexOf("const url=browserHybridMediaUrl")) {
            throw new Error("Live browser MP4 parser failed its URL initialization regression check.");
          }
          console.log("Live browser MP4 parser URL initialization check passed.");
          if (!downloaderSource.includes("youtube-engine-status") || !downloaderSource.includes("youtube-nocookie.com/embed/") || !downloaderSource.includes("const downloadInfo={...info,outputName:") || !downloaderSource.includes("ffmpegUnavailable&&mode===\"video\"&&selected.videoOnly") || !downloaderSource.includes("function updateDownloadProgress") || !downloaderSource.includes("const exactProgressive=") || !downloaderSource.includes("Tahap 2/3 · Audio") || !downloaderSource.includes("fetchYoutubeTrackRanges") || !downloaderSource.includes("indexedDB.open(\"aryanzz-download-resume\"") || !downloaderSource.includes("Maksimal · 5 jalur") || !downloaderSource.includes("const chunkSize=1024*1024") || !downloaderSource.includes("inFlight+=result.value.byteLength") || !downloaderSource.includes("probeYoutubeTrack") || !downloaderSource.includes("await ffmpeg.writeFile(inputVideo,videoBytes);videoBytes=null;") || !downloaderSource.includes("/api/youtube/hybrid/thumbnail") || !downloaderSource.includes("?local=true") || !downloaderSource.includes("probe=1") || !downloaderSource.includes("diagnostics.push({provider,instance,error:") || !downloaderSource.includes("pipedInstances.slice(0,20)") || !downloaderSource.includes("speedLabel.hidden=!isYouTube") || !downloaderSource.includes("/api/youtube/hybrid/browser-file?") || !downloaderSource.includes("navigator.serviceWorker?.controller") || !downloaderSource.includes("function youtubeQualityEstimate") || !downloaderSource.includes("details.append(thumbAction)") || !downloaderSource.includes("async function refreshYoutubeProviderInfo") || !downloaderSource.includes("const [downloadedVideo,readyFfmpeg]=await Promise.all([") || downloaderSource.includes('make("img","youtube-thumbnail")')) {
            throw new Error("Live downloader is missing the V73.7 progressive MP4 or progress/ETA improvements.");
          }
          const downloaderCssResponse = await fetch(base + "/downloader.css?v=78.0", { cache: "no-store" });
          const downloaderCssSource = await downloaderCssResponse.text();
          if (!downloaderCssResponse.ok || !downloaderCssSource.includes(".youtube-result [hidden]{display:none!important}") || !downloaderCssSource.includes("aryanzzDownloadSweep") || downloaderCssSource.includes("position:absolute")) {
            throw new Error("Live downloader CSS is missing hidden-control or animated-progress fixes.");
          }
          console.log("V73.7 direct MP4 quality estimates, measured file sizes, browser-side streaming fallback and clean thumbnail download checks passed.");

          const audioJsResponse = await fetch(base + "/audio-studio.js?v=78.0", { cache: "no-store" });
          const audioJsSource = await audioJsResponse.text();
          const audioCssResponse = await fetch(base + "/audio-studio.css?v=78.0", { cache: "no-store" });
          if (!audioJsResponse.ok || !audioCssResponse.ok || !audioJsSource.includes("libmp3lame") || !audioJsSource.includes("equalizer=f=") || !audioJsSource.includes("audioStudioTempo") || !audioJsSource.includes("id3v2_version") || !audioJsSource.includes("aryanzz.audio-studio.settings.v75")) {
            throw new Error("V78.0 Audio Studio assets are missing or incomplete.");
          }
          const pageResponse = await fetch(base + "/", { cache: "no-store" });
          const pageSource = await pageResponse.text();
          if (!pageSource.includes('data-platform="threads"') || !pageSource.includes('data-platform="soundcloud"') || !pageSource.includes('data-platform="capcut"')) {
            throw new Error("V78.0 universal media picker is missing Threads, SoundCloud, or CapCut.");
          }
          if (!downloaderSource.includes("available.map(value=>[value,value+\"p · tersedia\"])") || !downloaderSource.includes("Persiapan 100% · ketuk tombol") || !downloaderSource.includes("Kesiapan tautan unduhan")) {
            throw new Error("V78.0 social quality selector or honest link-ready progress is missing.");
          }
          if (!pageResponse.ok || !pageSource.includes("ARYANZZ V78.0") || !pageSource.includes("restoreAutoBackup") || !pageSource.includes("audioStudio") || !pageSource.includes("profileMotionToggle") || !pageSource.includes("Kontrol banner profil") || !pageSource.includes("audioStudioTempo") || !pageSource.includes("audioStudioTitle")) {
            throw new Error("V74.0 page, profile backup, or Audio Studio markup is not live.");
          }
          console.log("V78.0 Audio Studio, profile backup, and creative assets are available.");

          const titleSearchProbe = await fetch(base + "/api/search", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query: "x" }) });
          if (titleSearchProbe.status !== 400) throw new Error("Title-search endpoint validation failed: HTTP " + titleSearchProbe.status);
          console.log("Title-search endpoint is mounted and validates query input.");

          const socialSearchProbe = await fetch(base + "/api/social/search", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ platform: "tiktok", query: "x" }) });
          if (socialSearchProbe.status !== 400) throw new Error("Social title-search endpoint validation failed: HTTP " + socialSearchProbe.status);
          console.log("Social title-search endpoint is mounted and validates platform/query input.");

          const musicResponse = await fetch(base + "/api/music/status", { cache: "no-store" });
          if (!musicResponse.ok) throw new Error("Music Finder status endpoint failed.");
          const music = await musicResponse.json();
          if (!music.configured || !music.videoUrlReady) {
            console.warn("Music recognition is not configured yet. Add AUDD_API_TOKEN or connect the external backend.");
          } else {
            console.log("Music recognition provider is configured.");
          }

          const statusResponse = await fetch(base + "/api/platform/status", { cache: "no-store" });
          const status = await statusResponse.json();
          if (!status.ok || status.backend !== "public-community-api") throw new Error("Zero-server platform handoff status failed: " + JSON.stringify(status));
          const platformIds = Array.isArray(status.platforms) ? status.platforms.map(item => item.id) : [];
          for (const platform of ["tiktok", "instagram", "snackvideo", "capcut"]) {
            if (!platformIds.includes(platform)) throw new Error("V78.0 platform capability missing: " + platform + " / " + JSON.stringify(status.platforms));
          }
          if (!status.platforms.every(item => item.pasteLink && item.titleSearch && item.preview === "range-proxy")) {
            throw new Error("V78.0 social platform link/search/preview capabilities are incomplete.");
          }
          if (!downloaderSource.includes("function normalizeMediaInput") || !downloaderSource.includes('["capcut.com","CapCut"]') || !downloaderSource.includes("Format selain MP4 tidak akan diberi ekstensi MP4 palsu")) {
            throw new Error("V78.0 paste normalization, CapCut recognition or genuine-MP4 guard is missing.");
          }
          if (!searchSource.includes("selected===\\"youtube\\"?\\"/api/search\\":\\"/api/social/search\\"") || !searchSource.includes("Lihat & unduh")) {
            throw new Error("V78.0 in-page social title search is missing.");
          }
          console.log("V78.0 TikTok, Instagram, SnackVideo and CapCut capability matrix passed; provider availability remains link-dependent.");

          const youtubeStatusResponse = await fetch(base + "/api/youtube/status", { cache: "no-store" });
          if (!youtubeStatusResponse.ok) throw new Error("Hybrid YouTube status endpoint failed.");
          const youtubeStatus = await youtubeStatusResponse.json();
          if (youtubeStatus.provider !== "Dynamic Piped + Invidious hybrid" || youtubeStatus.paidProvider !== false || youtubeStatus.cobalt !== false) {
            throw new Error("V73.7 must use the no-paid Piped/Invidious hybrid only: " + JSON.stringify(youtubeStatus));
          }
          console.log("Hybrid YouTube status confirms dynamic Piped + Invidious, no Cobalt and no paid provider.");

          const hybridProbe = await fetch(base + "/api/youtube/hybrid/info?url=" + encodeURIComponent("https://youtu.be/4dpnHLPMQGs"), { cache: "no-store", signal: AbortSignal.timeout(45000) });
          if (!hybridProbe.ok) throw new Error("Hybrid YouTube endpoint failed: HTTP " + hybridProbe.status);
          const hybridData = await hybridProbe.json();
          if (!Array.isArray(hybridData.formats)) throw new Error("Hybrid endpoint did not return a formats array.");
          if (hybridData.providerReady) {
            if (!["Piped", "Invidious"].includes(hybridData.provider) || !hybridData.formats.length) throw new Error("Hybrid provider response is incomplete.");
            const mp4Formats = hybridData.formats.filter(item => item.mode === "video" && item.ext === "mp4");
            const candidates = mp4Formats.slice(0, 20);
            let streamReady = false;
            const streamFailures = [];
            for (const candidate of candidates) {
              const streamUrl = base + "/api/youtube/hybrid/file?url=" + encodeURIComponent(candidate.url) + "&ext=mp4&title=ARYANZZ-smoke&instance=" + encodeURIComponent(candidate.instance || hybridData.instance || "") + "&probe=1";
              const response = await fetch(streamUrl, { cache: "no-store", signal: AbortSignal.timeout(30000) });
              const result = await response.json().catch(() => ({}));
              if (response.ok && result.ok) { streamReady = true; break; }
              streamFailures.push(result.error || ("HTTP " + response.status));
            }
            if (candidates.length && !streamReady) console.warn("Live public providers returned metadata but blocked or failed stream preflight; deployment remains healthy and download availability depends on the provider: " + streamFailures.join(" | "));
            if (streamReady) console.log("Live MP4 stream passed the one-byte preflight through the Worker.");
            if (!mp4Formats.length) console.warn("The server-side community probe returned no MP4; browser-side Invidious discovery remains the primary route.");
            else console.log("Live public instance returned " + mp4Formats.length + " progressive MP4 video formats from " + hybridData.provider + ".");
          } else {
            console.warn("No public instance currently returned a compatible stream. Diagnostics: " + JSON.stringify(hybridData.diagnostics || []));
            console.warn("The zero-cost failover path is deployed, but real download availability is not confirmed.");
          }
          NODE
