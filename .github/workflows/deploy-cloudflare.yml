name: Deploy ARYANZZ V67.0 to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Configure self-hosted extractor origin
        env:
          PLATFORM_API_ORIGIN: ${{ secrets.PLATFORM_API_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PLATFORM_API_ORIGIN" ]; then
            echo "::warning::PLATFORM_API_ORIGIN is not configured. Platform-page extraction will remain offline; direct media URLs still work."
          else
            printf '%s' "$PLATFORM_API_ORIGIN" | wrangler secret put PLATFORM_API_ORIGIN
          fi

      - name: Configure self-hosted extractor token
        env:
          PLATFORM_API_TOKEN: ${{ secrets.PLATFORM_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PLATFORM_API_TOKEN" ]; then
            echo "::warning::PLATFORM_API_TOKEN is not configured. Platform-page extraction will remain offline; direct media URLs still work."
          else
            printf '%s' "$PLATFORM_API_TOKEN" | wrangler secret put PLATFORM_API_TOKEN
          fi

      - name: Configure AudD music recognition secret
        env:
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$AUDD_API_TOKEN" ]; then
            echo "::warning::AUDD_API_TOKEN is not configured. Music Finder will remain disabled until the secret is added."
          else
            printf '%s' "$AUDD_API_TOKEN" | wrangler secret put AUDD_API_TOKEN
          fi

      - name: Deploy Worker and static assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test live Worker and V67.0 editor assets
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const healthResponse = await fetch(base + "/api/health", { cache: "no-store" });
          if (!healthResponse.ok) throw new Error("Live Worker health check failed: HTTP " + healthResponse.status);
          const health = await healthResponse.json();
          if (health.version !== "67.0" || !health.selfHostedDownloader || !health.directMediaDownload) {
            throw new Error("Live Worker version or downloader status is incorrect: " + JSON.stringify(health));
          }
          console.log("Live Worker health OK: V" + health.version + ".");

          for (const path of ["/editor.js?v=65.0", "/editor-pro.css?v=65.0", "/music-recognition.js?v=67.0", "/music-recognition.css?v=67.0", "/v59.js?v=59.5", "/v59.css?v=59.5"]) {
            const response = await fetch(base + path, { cache: "no-store" });
            if (!response.ok) throw new Error("Static asset unavailable: " + path + " HTTP " + response.status);
          }
          console.log("V67.0 Creative Studio and Music Finder assets are available.");

          const musicResponse = await fetch(base + "/api/music/status", { cache: "no-store" });
          if (!musicResponse.ok) throw new Error("Music Finder status endpoint failed.");
          const music = await musicResponse.json();
          if (!music.configured || !music.videoUrlReady) {
            throw new Error("Live Worker cannot read AUDD_API_TOKEN. Check the secret binding on the production Worker service.");
          }
          console.log("Music Finder recognition provider is configured on the live Worker.");

          const statusResponse = await fetch(base + "/api/platform/status", { cache: "no-store" });
          const status = await statusResponse.json();
          if (!status.configured) {
            console.warn("Self-hosted extractor is not connected yet. Add PLATFORM_API_ORIGIN and PLATFORM_API_TOKEN secrets after starting the local backend package or another supported backend host.");
          } else if (!status.ok) {
            console.warn("Extractor is configured but did not respond healthy. Check the backend service.");
          } else {
            console.log("Self-hosted extractor is online.");
          }
          NODE
