name: ARYANZZ V71.0 live community API probe

on:
  push:
    branches: [feature/aryanzz-v71-hybrid-public-apis]
  workflow_dispatch:

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe YouTube.js, Piped and Invidious streams (no file download)
        run: node tests/public-api-live.mjs
