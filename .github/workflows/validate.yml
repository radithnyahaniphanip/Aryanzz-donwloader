name: ARYANZZ — Manual syntax validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/v674.js
          node --check public/downloader.js
          node --check public/audio-studio.js
          node --check public/link-bypass.js
          node --check public/ffmpeg-worker-bootstrap.js
          node --check public/editor.js
          node --check public/advanced.js
          node --check public/sw.js
          node --check tests/release-smoke.mjs
          node --check tests/live-release-smoke.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const s=h.indexOf('<script>')+8;const e=h.indexOf('</script>',s);if(s<8||e<s)throw Error('Inline script missing');new Function(h.slice(s,e));console.log('Inline script syntax OK')"
      - name: Run release smoke tests
        run: npm run test:release
