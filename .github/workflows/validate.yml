name: Validate ARYANZZ V72.1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check server/index.js
          node --check public/advanced.js
          node --check public/v15.js
          node --check public/v25.js
          node --check public/v59.js
          node --check public/editor.js
          node --check public/owner.js
          node --check public/downloader.js
          node --check public/ffmpeg-worker-bootstrap.js
          node --check public/v677.js
          node --check public/v680.js
          node --check public/v674.js
          node --check public/music-recognition.js
          node --check public/sw.js
          node --check tests/smoke.mjs
          python3 -m py_compile server/shazam_recognize.py
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const s=h.indexOf('<script>')+8;const e=h.indexOf('</script>',s);if(s<8||e<s)throw Error('Inline script missing');new Function(h.slice(s,e));console.log('Inline script syntax OK')"
      - name: Smoke tests
        run: node tests/smoke.mjs
