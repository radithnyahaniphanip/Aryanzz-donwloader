name: ARYANZZ V95 dedicated platform diagnostics

on:
  push:
    branches:
      - diagnostics/v95-dedicated-platform-matrix

permissions:
  contents: read

jobs:
  matrix:
    name: Test 20 dedicated public platform providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run live 20-platform extraction and title-search matrix
        env:
          WORKER_URL: https://aryanzz-donwloader.radithnyahaniphanip.workers.dev
        run: node tests/live-platform-matrix.mjs
      - name: Upload platform diagnostic report
        if: always() && hashFiles('platform-matrix.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aryanzz-v95-dedicated-platform-matrix
          path: platform-matrix.json
          retention-days: 14
