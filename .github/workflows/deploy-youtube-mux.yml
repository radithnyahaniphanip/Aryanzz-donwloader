name: Deploy ARYANZZ YouTube 2K-8K MP4 Mux

on:
  workflow_dispatch:
    inputs:
      confirm_workers_paid:
        description: "I confirm this Cloudflare account is on Workers Paid and I approve metered Container/egress usage."
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aryanzz-youtube-mux-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_workers_paid == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare credentials and Docker
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          docker info >/dev/null
          echo "Cloudflare credentials and Docker are available."
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Deploy the isolated FFmpeg Container Worker
        run: wrangler deploy --config wrangler-youtube-mux.toml
      - name: Create and install a shared private service token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" | wrangler secret put MUX_TOKEN --config wrangler-youtube-mux.toml
          printf '%s' "$TOKEN" | wrangler secret put YOUTUBE_MUX_TOKEN --config wrangler.toml
          printf '%s' "https://aryanzz-youtube-mux.aryanz.workers.dev" | wrangler secret put YOUTUBE_MUX_URL --config wrangler.toml
          unset TOKEN
      - name: Verify mux service endpoint
        run: |
          curl --fail --silent --show-error https://aryanzz-youtube-mux.aryanz.workers.dev/health
          echo
