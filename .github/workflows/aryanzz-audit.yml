name: ARYANZZ V1 regression checks

on:
  push:
    branches:
      - feature/aryanzz-100-tools-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aryanzz-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Run full release regression tests
        run: npm run test:release
