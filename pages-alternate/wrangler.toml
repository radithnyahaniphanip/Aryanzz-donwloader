# Separate Cloudflare Pages access hostname for mobile networks that block workers.dev.
# Keep the original Worker as the sole backend and secrets/D1 owner.
name = "aryanzz-access-alternate"
compatibility_date = "2026-11-21"
pages_build_output_dir = "../public"

[[services]]
binding = "ARYANZZ_BACKEND"
service = "aryanzz-donwloader"
