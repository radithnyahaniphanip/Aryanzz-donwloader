name = "aryanzz-youtube-mux"
main = "src/youtube-mux-worker.js"
compatibility_date = "2026-11-20"
workers_dev = true
keep_vars = true

[[containers]]
class_name = "YouTubeMuxContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./mux-container/Dockerfile"

[[durable_objects.bindings]]
name = "YOUTUBE_MUX"
class_name = "YouTubeMuxContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["YouTubeMuxContainer"]

[observability]
enabled = true
