name = "aryanzz-donwloader"
main = "src/index.js"
compatibility_date = "2026-10-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[containers]]
class_name = "DownloaderContainer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "DOWNLOADER_CONTAINER"
class_name = "DownloaderContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DownloaderContainer"]

[observability]
enabled = true
