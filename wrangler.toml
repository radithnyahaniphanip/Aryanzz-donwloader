name = "aryanzz-donwloader"
main = "src/index.js"
compatibility_date = "2026-10-31"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]


[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DownloaderContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["DownloaderContainer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MembershipStore"]


[vars]
ARYANZZ_BUILD_VERSION = "__ARYANZZ_VERSION__"
ARYANZZ_PUBLIC_ORIGIN = "https://aryanzz-donwloader.aryanz.workers.dev"
