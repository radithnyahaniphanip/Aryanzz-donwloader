name = "aryanzz-donwloader"
main = "src/index.js"
compatibility_date = "2026-10-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]


# V94 account registration requires a Cloudflare D1 database.
# After creating the D1 database named aryanzz-users, add its real database_id here:
# [[d1_databases]]
# binding = "DB"
# database_name = "aryanzz-users"
# database_id = "PASTE_REAL_D1_DATABASE_ID_HERE"

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DownloaderContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["DownloaderContainer"]
