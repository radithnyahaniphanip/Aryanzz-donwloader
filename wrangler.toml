name = "aryanzz-donwloader"
main = "src/index.js"
compatibility_date = "2026-10-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]


[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DownloaderContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["DownloaderContainer"]

[[d1_databases]]
binding = "DB"
database_name = "aryanzz-auth"
database_id = "AUTO_CREATE_D1_DATABASE_ID"
migrations_dir = "migrations"
