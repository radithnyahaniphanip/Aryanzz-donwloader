services:
  media-mux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aryanzz-media-mux
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      MUX_TOKEN: ${MUX_TOKEN:?Set MUX_TOKEN in mux-container/.env}
      MUX_ALLOWED_HOSTS: ${MUX_ALLOWED_HOSTS:-}
    expose:
      - "8080"
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    container_name: aryanzz-media-mux-proxy
    restart: unless-stopped
    environment:
      MUX_DOMAIN: ${MUX_DOMAIN:?Set MUX_DOMAIN in mux-container/.env}
    depends_on:
      - media-mux
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
