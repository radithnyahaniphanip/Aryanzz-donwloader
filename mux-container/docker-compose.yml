services:
  media-mux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aryanzz-media-mux
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      MUX_TOKEN: ${MUX_TOKEN:?Set MUX_TOKEN in mux-container/.env}
      MUX_ALLOWED_HOSTS: ${MUX_ALLOWED_HOSTS:-}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
